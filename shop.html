<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Borneology – Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="hornbill.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
  <div class="motif-strip"></div>
  <div class="container">
    <div class="nav">
      <a class="logo" href="index.html">
        <div class="logo-icon"></div>
        <div>
          <div class="logo-text-main">Borneology</div>
          <div class="logo-text-sub">Sarawak Handicrafts</div>
        </div>
      </a>
      
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html" class="active">Shop Now</a>
        <a href="contact.html">Contact</a>
      </nav>
      
      <div class="nav-utility">
        <button class="icon-btn" data-counter="wishlist" id="wishlistBtn" title="Wishlist">♡<span>0</span></button>
        <button class="icon-btn" data-counter="cart" id="cartBtn" title="Cart">🛒<span>0</span></button>
        <a href="track-order.html" class="icon-btn-track" title="Track Order"></a>
        <div class="profile-trigger" id="profileTrigger">
          <img src="" alt="Profile" id="navAvatar" />
          <span>Profile</span>
        </div>
        <button class="menu-toggle" id="menuToggle">Menu</button>
      </div>
    </div>
    
    <div class="profile-menu" id="profileMenu">
      <a href="profile.html">My profile</a>
      <a href="wishlist.html">Wishlist</a>
      <a href="checkout.html">Checkout</a>
        <a href="track-order.html" class="track-order-link">📦 Track Order</a>
      <a href="login.html">Login / Logout</a>
    </div>
    
    <nav class="nav-drawer" id="navDrawer">
      <a href="index.html">Home</a>
      <a href="shop.html" class="active">Shop Now</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>
  <main>
    <section>
      <div class="container">
        <div class="section-title">Shop Sarawak Handicrafts</div>
        <div class="shop-layout">
          <aside class="filter-panel">
            <h3>Filter</h3>
            <label for="filterCategory">Craft type</label>
            <select id="filterCategory">
              <option value="all">All</option>
              <option value="textile">Textile</option>
              <option value="bag">Bag / Weave</option>
              <option value="wood">Wood Carving</option>
              <option value="beads">Beads</option>
            </select>

            <label for="filterPrice">Max price (RM)</label>
            <input type="range" id="filterPrice" min="35" max="200" value="200" />
            <div id="filterPriceLabel" style="font-weight:600;">RM200</div>

            <label>Availability</label>
            <div style="display:flex; flex-direction:column; gap:0.35rem;">
              <label><input type="checkbox" checked /> Ready stock</label>
              <label><input type="checkbox" checked /> Pre-order</label>
            </div>
          </aside>

          <div class="shop-grid" id="productGrid">
            <!-- Products will be loaded dynamically from database -->
            <p style="color:var(--text-muted); grid-column:1/-1; text-align:center; padding:2rem;">Loading products...</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    © 2025 Borneology – Sarawak crafts, worldwide.
  </footer>

  <script src="app-backend.js"></script>
  <script src="app.js"></script>
  <script>
    // Load products from database
    async function loadProducts() {
      const productGrid = document.getElementById("productGrid");
      if (!productGrid) return;
      
      try {
        const products = await window.API.getProducts();
        
        if (products.length === 0) {
          productGrid.innerHTML = "<p style='color:var(--text-muted); grid-column:1/-1;'>No products available at the moment.</p>";
          return;
        }
        
        // Load seller info for verified badge
        const sellerIds = [...new Set(products.map(p => p.sellerId).filter(Boolean))];
        const sellerInfo = {};
        for (const sellerId of sellerIds) {
          try {
            const sellerData = await window.API.getUser(sellerId);
            if (sellerData && sellerData.isVerifiedSeller) {
              sellerInfo[sellerId] = true;
            }
          } catch (e) {
            // Ignore errors
          }
        }
        
        productGrid.innerHTML = products.map(product => `
          <article class="product-card" data-category="${product.category || 'other'}" data-price="${product.price || 0}">
            <div style="position:relative;">
              <a href="product-detail.html?id=${product.id}" style="display:block; cursor:pointer;">
                <img src="${product.image || 'placeholder.jpg'}" alt="${product.name}" onerror="this.onerror=null; this.src='hornbill.jpg';" style="cursor:pointer; transition:opacity 0.2s;" onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'" />
              </a>
              ${product.sellerId && sellerInfo[product.sellerId] ? '<span style="position:absolute; top:0.5rem; right:0.5rem; background:#10b981; color:white; padding:0.25rem 0.5rem; border-radius:999px; font-size:0.7rem; font-weight:600;">✓ Verified Seller</span>' : ''}
            </div>
            <div class="product-name">${product.name}</div>
            <div class="product-price">RM${(product.price || 0).toFixed(2)}</div>
            <div class="quantity-selector">
              <button class="quantity-btn" data-action="decrease" data-product-id="${product.id}">−</button>
              <input type="number" class="quantity-input" value="1" min="1" max="99" data-product-id="${product.id}" />
              <button class="quantity-btn" data-action="increase" data-product-id="${product.id}">+</button>
            </div>
            <div class="btn-group">
              <button class="btn btn-wishlist" data-product data-action="wishlist" data-id="${product.id}" data-name="${product.name}" data-price="${product.price}" data-image="${product.image || 'placeholder.jpg'}" title="Save to wishlist">♡</button>
              <button class="btn btn-primary btn-cart" data-product data-action="cart" data-id="${product.id}" data-name="${product.name}" data-price="${product.price}" data-image="${product.image || 'placeholder.jpg'}">Add to Cart</button>
            </div>
            <a href="product-detail.html?id=${product.id}" class="btn btn-outline btn-wide" style="margin-top:0.5rem;">View Details</a>
          </article>
        `).join('');
        
        // Re-initialize event listeners for new buttons
        if (window.initializeStorage) {
          window.initializeStorage();
        }
        
        // Re-attach quantity buttons
        document.querySelectorAll(".quantity-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const productId = btn.dataset.productId || btn.getAttribute("data-product-id");
            const action = btn.dataset.action || btn.getAttribute("data-action");
            const input = document.querySelector(`.quantity-input[data-product-id="${productId}"]`);
            if (!input) return;
            
            let value = parseInt(input.value) || 1;
            if (action === "increase") {
              value = Math.min(99, value + 1);
            } else if (action === "decrease") {
              value = Math.max(1, value - 1);
            }
            input.value = value;
          });
        });
        
        // Re-attach product buttons
        document.querySelectorAll("[data-product]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const isLoggedIn = localStorage.getItem("isLoggedIn");
            if (!isLoggedIn || isLoggedIn !== "true") {
              const action = btn.dataset.action;
              const actionName = action === "cart" ? "cart" : "wishlist";
              if (confirm(`Please login to add items to your ${actionName}. Would you like to go to the login page?`)) {
                window.location.href = `login.html?redirect=${window.location.pathname}`;
              }
              return;
            }

            const { action, id, name, price, image } = btn.dataset;
            const userId = window.API ? window.API.getUserId() : null;
            
            const quantityInput = document.querySelector(`.quantity-input[data-product-id="${id}"]`);
            const quantity = quantityInput ? parseInt(quantityInput.value) || 1 : 1;
            
            try {
              if (userId && window.API) {
                if (action === 'cart') {
                  await window.API.addToCart(userId, id, quantity);
                } else if (action === 'wishlist') {
                  await window.API.addToWishlist(userId, id);
                }
                if (window.initializeStorage) await window.initializeStorage();
              }
              
              btn.classList.add("added");
              setTimeout(() => btn.classList.remove("added"), 600);
              
              if (window.updateCounters) window.updateCounters();
              if (window.showToast) showToast(`${name} (${quantity}x) added to ${action}`);
            } catch (error) {
              console.error('Error adding to', action, error);
              if (window.showToast) showToast(`Failed to add ${name} to ${action}`);
            }
          });
        });
        
        // Re-apply filters
        if (window.applyFilters) {
          setTimeout(() => {
            const categorySelect = document.getElementById("filterCategory");
            const priceRange = document.getElementById("filterPrice");
            if (categorySelect || priceRange) {
              // Trigger filter update
              if (categorySelect) categorySelect.dispatchEvent(new Event('change'));
              if (priceRange) priceRange.dispatchEvent(new Event('input'));
            }
          }, 100);
        }
      } catch (error) {
        console.error('Failed to load products:', error);
        productGrid.innerHTML = "<p style='color:var(--text-muted); grid-column:1/-1;'>Failed to load products. Please refresh the page.</p>";
      }
    }
    
    // Load products when page loads
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadProducts);
    } else {
      loadProducts();
    }
  </script>
</body>
</html>
